<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hobby Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0f0716;
      --panel-bg: rgba(28, 16, 48, 0.7);
      --panel-border: rgba(255, 105, 180, 0.25);
      --pink-glow: #ff2a85;
      --purple-glow: #9d4edf;
      --cyan-glow: #00f0ff;
      --text-main: #f8f0fc;
      --text-muted: #b8a6cd;
      
      --energy-low-bg: rgba(46, 204, 113, 0.2);
      --energy-low-border: #2ecc71;
      --energy-low-text: #60ef9b;
      
      --energy-med-bg: rgba(241, 196, 15, 0.2);
      --energy-med-border: #f1c40f;
      --energy-med-text: #ffeb3b;
      
      --energy-high-bg: rgba(155, 89, 182, 0.25);
      --energy-high-border: #9b59b6;
      --energy-high-text: #e0aaff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 42, 133, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(157, 78, 223, 0.2) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.08) 0%, transparent 60%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Closet Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 1.25rem 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 20%, #ff80bf 60%, var(--cyan-glow) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .auth-box {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--pink-glow);
      box-shadow: 0 0 10px rgba(255, 42, 133, 0.5);
    }

    .user-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    /* Buttons */
    .btn {
      background: linear-gradient(135deg, #ff2a85 0%, #9d4edf 100%);
      color: #fff;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 12px;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 15px rgba(255, 42, 133, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 20px rgba(255, 42, 133, 0.6), 0 0 12px var(--cyan-glow);
    }

    .btn-sm {
      padding: 0.4rem 0.8rem;
      font-size: 0.75rem;
      border-radius: 8px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
    }

    /* Controls */
    .controls-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
    }

    .filter-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    /* Energy Chips */
    .energy-chips {
      display: flex;
      gap: 0.6rem;
    }

    .chip {
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border: 1.5px solid transparent;
      opacity: 0.55;
    }

    .chip.active {
      opacity: 1;
      transform: scale(1.05);
    }

    .chip-low {
      background: var(--energy-low-bg);
      border-color: var(--energy-low-border);
      color: var(--energy-low-text);
    }

    .chip-low.active {
      box-shadow: 0 0 12px rgba(46, 204, 113, 0.5);
    }

    .chip-med {
      background: var(--energy-med-bg);
      border-color: var(--energy-med-border);
      color: var(--energy-med-text);
    }

    .chip-med.active {
      box-shadow: 0 0 12px rgba(241, 196, 15, 0.5);
    }

    .chip-high {
      background: var(--energy-high-bg);
      border-color: var(--energy-high-border);
      color: var(--energy-high-text);
    }

    .chip-high.active {
      box-shadow: 0 0 12px rgba(155, 89, 182, 0.6);
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .select-styled {
      background: rgba(15, 7, 22, 0.8);
      color: var(--text-main);
      border: 1px solid var(--panel-border);
      padding: 0.6rem 1rem;
      border-radius: 12px;
      font-weight: 700;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--pink-glow), var(--purple-glow), var(--cyan-glow));
      opacity: 0.7;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(255, 105, 180, 0.6);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 42, 133, 0.3);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .card-emoji {
      font-size: 2.2rem;
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      line-height: 1.2;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    .tag {
      padding: 0.25rem 0.65rem;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .tag-low { background: var(--energy-low-bg); border-color: var(--energy-low-border); color: var(--energy-low-text); }
    .tag-med { background: var(--energy-med-bg); border-color: var(--energy-med-border); color: var(--energy-med-text); }
    .tag-high { background: var(--energy-high-bg); border-color: var(--energy-high-border); color: var(--energy-high-text); }

    .card-footer {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      background: var(--panel-bg);
      border-radius: 20px;
      border: 1px dashed var(--panel-border);
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Modals & Overlays */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 3, 18, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #180b2a;
      border: 1px solid var(--pink-glow);
      box-shadow: 0 0 40px rgba(255, 42, 133, 0.3);
      border-radius: 24px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 1rem;
    }

    .modal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      background: rgba(10, 3, 18, 0.6);
      border: 1px solid rgba(255, 105, 180, 0.3);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--pink-glow);
      box-shadow: 0 0 10px rgba(255, 42, 133, 0.4);
    }

    /* Detail View Stash Lists */
    .stash-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .stash-box {
      background: rgba(10, 3, 18, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1rem;
    }

    .stash-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--pink-glow);
      margin-bottom: 0.75rem;
    }

    .stash-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .stash-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .stash-input-group {
      display: flex;
      gap: 0.4rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Hobby Vault</h1>
      <div id="authContainer" class="auth-box">
        <!-- Auth state injected via JS -->
      </div>
    </header>

    <div class="controls-panel">
      <div class="filter-section">
        <span class="filter-label">Energy Level:</span>
        <div class="energy-chips">
          <div class="chip chip-low" onclick="toggleChip(this, 1)">Low Energy</div>
          <div class="chip chip-med" onclick="toggleChip(this, 2)">Medium Energy</div>
          <div class="chip chip-high" onclick="toggleChip(this, 3)">High Energy</div>
        </div>
      </div>

      <div class="action-group">
        <select id="sortBy" class="select-styled" onchange="renderGrid()">
          <option value="recent-desc">Most Recent First</option>
          <option value="recent-asc">Oldest / Resting First</option>
          <option value="energy-asc">Energy: Low to High</option>
          <option value="energy-desc">Energy: High to Low</option>
        </select>
        
        <button class="btn btn-secondary" onclick="triggerRandomizer()">Randomizer</button>
        <button id="addHobbyBtn" class="btn" style="display:none;" onclick="openAddModal()">+ Add Hobby</button>
      </div>
    </div>

    <div id="hobbyGrid" class="grid">
      <!-- Cards injected dynamically -->
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModalOverlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:0.75rem;">
          <span id="detailEmoji" style="font-size: 2rem;"></span>
          <div>
            <h2 id="detailTitle" class="modal-title">Hobby Detail</h2>
            <div id="detailMeta" style="font-size:0.8rem; color:var(--text-muted);"></div>
          </div>
        </div>
        <button class="close-btn" onclick="closeModal('detailModalOverlay')">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label">Current Focus</label>
        <div id="detailFocus" style="font-size:0.95rem; line-height:1.4;"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Inspiration & Resources</label>
        <div id="detailResources" style="font-size:0.95rem; line-height:1.4;"></div>
      </div>

      <div class="stash-grid">
        <div class="stash-box">
          <div class="stash-title">Owned Supplies</div>
          <ul id="detailOwnedList" class="stash-list"></ul>
          <div class="stash-input-group">
            <input type="text" id="newOwnedInput" class="form-input" style="padding:0.4rem;" placeholder="Add supply...">
            <button class="btn btn-sm" onclick="addStashItem('owned')">+</button>
          </div>
        </div>

        <div class="stash-box">
          <div class="stash-title">Wishlist</div>
          <ul id="detailWantedList" class="stash-list"></ul>
          <div class="stash-input-group">
            <input type="text" id="newWantedInput" class="form-input" style="padding:0.4rem;" placeholder="Add to wishlist...">
            <button class="btn btn-sm" onclick="addStashItem('wanted')">+</button>
          </div>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; margin-top:1.5rem; padding-top:1rem; border-top:1px solid rgba(255,255,255,0.1);">
        <button class="btn btn-secondary" onclick="editCurrentHobby()">Edit Hobby</button>
        <button class="btn btn-secondary" onclick="closeModal('detailModalOverlay')">Done</button>
      </div>
    </div>
  </div>

  <!-- Form Modal (Add / Edit) -->
  <div id="formModalOverlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="formModalTitle" class="modal-title">Add Hobby</h2>
        <button class="close-btn" onclick="closeModal('formModalOverlay')">✕</button>
      </div>

      <form id="hobbyForm" onsubmit="saveHobby(event)">
        <input type="hidden" id="hobbyId">

        <div style="display:grid; grid-template-columns:80px 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label">Emoji</label>
            <input type="text" id="inputEmoji" class="form-input" style="text-align:center; font-size:1.2rem;" placeholder="🎨" maxlength="4">
          </div>

          <div class="form-group">
            <label class="form-label">Hobby Title</label>
            <input type="text" id="inputTitle" class="form-input" required placeholder="e.g. Jewelry Making">
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label">Energy Level</label>
            <select id="inputEnergy" class="form-select">
              <option value="1">Low Energy</option>
              <option value="2">Medium Energy</option>
              <option value="3">High Energy</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Last Active Date</label>
            <input type="date" id="inputLastDone" class="form-input" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Location</label>
          <input type="text" id="inputLocation" class="form-input" placeholder="e.g. Desk, Studio, Balcony">
        </div>

        <div class="form-group">
          <label class="form-label">Current Focus</label>
          <textarea id="inputFocus" class="form-textarea" rows="2" placeholder="What are you currently working on?"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Resources & Links</label>
          <textarea id="inputResources" class="form-textarea" rows="2" placeholder="Links, guides, inspiration..."></textarea>
        </div>

        <div style="display:flex; justify-content:space-between; gap:1rem; margin-top:1.5rem;">
          <button type="button" id="deleteBtn" class="btn btn-danger" onclick="deleteHobby()" style="display:none;">Delete</button>
          <div style="display:flex; gap:0.5rem; margin-left:auto;">
            <button type="button" class="btn btn-secondary" onclick="closeModal('formModalOverlay')">Cancel</button>
            <button type="submit" class="btn">Save Hobby</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Unified Firebase Auth & DB Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getDatabase, ref, onValue, set, push, remove } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDqPjoCg0gYKmxBkF3-7eqYilmLdJqvGU8",
      authDomain: "house-motives.firebaseapp.com",
      databaseURL: "https://house-motives-default-rtdb.firebaseio.com",
      projectId: "house-motives",
      storageBucket: "house-motives.firebasestorage.app",
      messagingSenderId: "338470965043",
      appId: "1:338470965043:web:6285a617886f5b87ce3846"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    window.currentUser = null;
    window.hobbies = [];
    window.activeHobbyId = null;
    window.selectedEnergies = [];

    const hobbiesRef = ref(db, 'hobbies');
    let unsubscribeListener = null;

    onAuthStateChanged(auth, (user) => {
      window.currentUser = user;
      const authContainer = document.getElementById('authContainer');
      const addHobbyBtn = document.getElementById('addHobbyBtn');

      if (user) {
        authContainer.innerHTML = `
          <img class="user-avatar" src="${user.photoURL}" alt="${user.displayName}">
          <span class="user-name">${user.displayName}</span>
          <button class="btn btn-sm btn-secondary" onclick="logout()">Sign Out</button>
        `;
        addHobbyBtn.style.display = 'inline-flex';

        if (unsubscribeListener) unsubscribeListener();
        unsubscribeListener = onValue(hobbiesRef, (snapshot) => {
          const data = snapshot.val();
          window.hobbies = [];
          if (data) {
            Object.keys(data).forEach(key => {
              window.hobbies.push({ id: key, ...data[key] });
            });
          }
          window.renderGrid();
          if (window.activeHobbyId) {
            window.updateDetailViewIfOpen();
          }
        }, (error) => {
          console.error("Firebase read error:", error);
          alert("Permission or Database Error: " + error.message);
        });

      } else {
        authContainer.innerHTML = `<button class="btn" onclick="login()">Sign in with Google</button>`;
        addHobbyBtn.style.display = 'none';
        window.hobbies = [];
        window.renderGrid();
      }
    });

    window.login = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth);

    function getAgingBadge(dateString) {
      if (!dateString) return 'Date unknown';
      const last = new Date(dateString);
      const now = new Date();
      const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));
      
      if (isNaN(diffDays)) return 'Date unknown';
      if (diffDays === 0) return 'Done today';
      if (diffDays === 1) return 'Done yesterday';
      if (diffDays < 7) return `Active ${diffDays}d ago`;
      if (diffDays < 14) return 'Resting 1 week';
      if (diffDays < 30) return `Resting ${Math.floor(diffDays / 7)} weeks`;
      if (diffDays < 365) return `Resting ${Math.floor(diffDays / 30)} months`;
      return 'Resting 1+ year';
    }

    function energyLabel(level) {
      if (level == 1) return 'Low Energy';
      if (level == 2) return 'Med Energy';
      if (level == 3) return 'High Energy';
      return '';
    }

    function energyTagClass(level) {
      if (level == 1) return 'tag-low';
      if (level == 2) return 'tag-med';
      if (level == 3) return 'tag-high';
      return '';
    }

    function linkify(text) {
      if (!text) return 'None';
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener" style="color:var(--cyan-glow);">${url}</a>`);
    }

    window.toggleChip = function(el, level) {
      el.classList.toggle('active');
      if (window.selectedEnergies.includes(level)) {
        window.selectedEnergies = window.selectedEnergies.filter(l => l !== level);
      } else {
        window.selectedEnergies.push(level);
      }
      window.renderGrid();
    };

    window.renderGrid = function() {
      const grid = document.getElementById('hobbyGrid');
      
      if (!window.currentUser) {
        grid.innerHTML = `<div class="empty-state">Please sign in to view your hobbies.</div>`;
        return;
      }

      const sortBy = document.getElementById('sortBy').value;

      let filtered = window.hobbies.filter(h => {
        if (window.selectedEnergies.length === 0) return true;
        return window.selectedEnergies.includes(parseInt(h.energy));
      });

      filtered.sort((a, b) => {
        if (sortBy === 'recent-desc') return new Date(b.lastDone) - new Date(a.lastDone);
        if (sortBy === 'recent-asc') return new Date(a.lastDone) - new Date(b.lastDone);
        if (sortBy === 'energy-asc') return a.energy - b.energy;
        if (sortBy === 'energy-desc') return b.energy - a.energy;
        return 0;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No hobbies match your filter.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(h => `
        <div class="card" onclick="openDetailModal('${h.id}')">
          <div class="card-top">
            <span class="card-emoji">${h.emoji || '🎨'}</span>
            <span class="tag ${energyTagClass(h.energy)}">${energyLabel(h.energy)}</span>
          </div>
          <div>
            <div class="card-title">${h.title}</div>
            <div class="card-tags">
              ${h.location ? `<span class="tag">${h.location}</span>` : ''}
            </div>
          </div>
          <div class="card-footer">
            ${getAgingBadge(h.lastDone)}
          </div>
        </div>
      `).join('');
    };

    window.openDetailModal = function(id) {
      window.activeHobbyId = id;
      window.updateDetailViewIfOpen();
      document.getElementById('detailModalOverlay').classList.add('active');
    };

    window.updateDetailViewIfOpen = function() {
      if (!window.activeHobbyId) return;
      const h = window.hobbies.find(item => item.id === window.activeHobbyId);
      if (!h) return;

      document.getElementById('detailEmoji').innerText = h.emoji || '🎨';
      document.getElementById('detailTitle').innerText = h.title;
      document.getElementById('detailMeta').innerText = `${getAgingBadge(h.lastDone)} • ${energyLabel(h.energy)} ${h.location ? '• ' + h.location : ''}`;
      document.getElementById('detailFocus').innerHTML = linkify(h.focus);
      document.getElementById('detailResources').innerHTML = linkify(h.resources);

      renderStashLists(h);
    };

    function renderStashLists(hobby) {
      const ownedUl = document.getElementById('detailOwnedList');
      const wantedUl = document.getElementById('detailWantedList');

      ownedUl.innerHTML = (hobby.owned || []).map((item, idx) => `
        <li class="stash-item">
          <span>${item}</span>
          <button class="btn btn-sm btn-secondary" onclick="removeStashItem('owned', ${idx})">✕</button>
        </li>
      `).join('') || '<li style="font-size:0.8rem; color:var(--text-muted);">No owned supplies listed.</li>';

      wantedUl.innerHTML = (hobby.wanted || []).map((item, idx) => `
        <li class="stash-item">
          <span>${item}</span>
          <div style="display:flex; gap:4px;">
            <button class="btn btn-sm" title="Move to Owned" onclick="moveWantedToOwned(${idx})">→ Owned</button>
            <button class="btn btn-sm btn-secondary" onclick="removeStashItem('wanted', ${idx})">✕</button>
          </div>
        </li>
      `).join('') || '<li style="font-size:0.8rem; color:var(--text-muted);">No wishlist items.</li>';
    }

    window.addStashItem = function(type) {
      if (!window.currentUser) return;
      const hobby = window.hobbies.find(h => h.id === window.activeHobbyId);
      if (!hobby) return;

      const inputId = type === 'owned' ? 'newOwnedInput' : 'newWantedInput';
      const input = document.getElementById(inputId);
      const val = input.value.trim();

      if (val) {
        let owned = hobby.owned ? [...hobby.owned] : [];
        let wanted = hobby.wanted ? [...hobby.wanted] : [];
        
        if (type === 'owned') owned.push(val);
        if (type === 'wanted') wanted.push(val);

        input.value = '';
        set(ref(db, `hobbies/${hobby.id}/owned`), owned);
        set(ref(db, `hobbies/${hobby.id}/wanted`), wanted);
      }
    };

    window.moveWantedToOwned = function(index) {
      if (!window.currentUser) return;
      const hobby = window.hobbies.find(h => h.id === window.activeHobbyId);
      if (!hobby) return;

      let owned = hobby.owned ? [...hobby.owned] : [];
      let wanted = hobby.wanted ? [...hobby.wanted] : [];

      const itemToMove = wanted.splice(index, 1)[0];
      if (itemToMove) {
        owned.push(itemToMove);
        set(ref(db, `hobbies/${hobby.id}/owned`), owned);
        set(ref(db, `hobbies/${hobby.id}/wanted`), wanted);
      }
    };

    window.removeStashItem = function(type, index) {
      if (!window.currentUser) return;
      const hobby = window.hobbies.find(h => h.id === window.activeHobbyId);
      if (!hobby) return;

      let owned = hobby.owned ? [...hobby.owned] : [];
      let wanted = hobby.wanted ? [...hobby.wanted] : [];

      if (type === 'owned') owned.splice(index, 1);
      if (type === 'wanted') wanted.splice(index, 1);

      set(ref(db, `hobbies/${hobby.id}/owned`), owned);
      set(ref(db, `hobbies/${hobby.id}/wanted`), wanted);
    };

    window.openAddModal = function() {
      document.getElementById('formModalTitle').innerText = 'Add Hobby';
      document.getElementById('hobbyId').value = '';
      document.getElementById('hobbyForm').reset();
      document.getElementById('inputEmoji').value = '🎨';
      document.getElementById('inputLastDone').valueAsDate = new Date();
      document.getElementById('deleteBtn').style.display = 'none';

      document.getElementById('formModalOverlay').classList.add('active');
    };

    window.editCurrentHobby = function() {
      closeModal('detailModalOverlay');
      const h = window.hobbies.find(item => item.id === window.activeHobbyId);
      if (!h) return;

      document.getElementById('formModalTitle').innerText = 'Edit Hobby';
      document.getElementById('hobbyId').value = h.id;
      document.getElementById('inputEmoji').value = h.emoji || '🎨';
      document.getElementById('inputTitle').value = h.title;
      document.getElementById('inputEnergy').value = h.energy;
      document.getElementById('inputLastDone').value = h.lastDone;
      document.getElementById('inputLocation').value = h.location || '';
      document.getElementById('inputFocus').value = h.focus || '';
      document.getElementById('inputResources').value = h.resources || '';
      document.getElementById('deleteBtn').style.display = 'block';

      document.getElementById('formModalOverlay').classList.add('active');
    };

    window.saveHobby = function(e) {
      e.preventDefault();
      if (!window.currentUser) return alert("Please sign in first!");

      const id = document.getElementById('hobbyId').value;
      const emoji = document.getElementById('inputEmoji').value.trim() || '🎨';
      const title = document.getElementById('inputTitle').value.trim();
      const energy = parseInt(document.getElementById('inputEnergy').value);
      const lastDone = document.getElementById('inputLastDone').value;
      const location = document.getElementById('inputLocation').value.trim();
      const focus = document.getElementById('inputFocus').value.trim();
      const resources = document.getElementById('inputResources').value.trim();

      const existing = window.hobbies.find(h => h.id === id);

      const hobbyData = {
        emoji,
        title,
        energy,
        lastDone,
        location,
        focus,
        resources,
        owned: existing ? (existing.owned || []) : [],
        wanted: existing ? (existing.wanted || []) : []
      };

      if (id) {
        set(ref(db, `hobbies/${id}`), hobbyData)
          .catch(err => alert("Save Error: " + err.message));
      } else {
        const newRef = push(hobbiesRef);
        set(newRef, hobbyData)
          .catch(err => alert("Save Error: " + err.message));
      }

      closeModal('formModalOverlay');
    };

    window.deleteHobby = function() {
      if (!window.currentUser) return;
      const id = document.getElementById('hobbyId').value;
      if (confirm('Are you sure you want to delete this hobby?')) {
        remove(ref(db, `hobbies/${id}`))
          .catch(err => alert("Delete Error: " + err.message));
        closeModal('formModalOverlay');
      }
    };

    window.triggerRandomizer = function() {
      if (window.hobbies.length === 0) return;
      const randomHobby = window.hobbies[Math.floor(Math.random() * window.hobbies.length)];
      openDetailModal(randomHobby.id);
    };

    window.closeModal = function(id) {
      document.getElementById(id).classList.remove('active');
    };
  </script>
</body>
</html>
