  <style>
    :root {
      /* Light Barbie Palette */
      --bg-main: #fff5f8;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --panel-border: rgba(255, 105, 180, 0.25);
      --barbie-pink: #ff1493;
      --barbie-dark-pink: #d8006f;
      --barbie-soft-pink: #ffe4ef;
      --barbie-accent: #e0247d;
      --text-dark: #3a0d25;
      --text-muted: #8c5270;
      
      --energy-low-bg: #e8fadf;
      --energy-low-border: #82c91e;
      --energy-low-text: #2b6100;
      
      --energy-med-bg: #fff3bf;
      --energy-med-border: #fcc419;
      --energy-med-text: #855200;
      
      --energy-high-bg: #f3d9fa;
      --energy-high-border: #cc5de8;
      --energy-high-text: #630c80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(255, 182, 193, 0.4) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(255, 105, 180, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 50% 30%, rgba(255, 240, 245, 0.8) 0%, transparent 60%);
      background-attachment: fixed;
      color: var(--text-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 1.25rem 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 25px rgba(230, 0, 115, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 2rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--barbie-pink) 0%, var(--barbie-dark-pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .auth-box {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--barbie-pink);
      box-shadow: 0 0 10px rgba(255, 20, 147, 0.25);
    }

    .user-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    /* Buttons */
    .btn {
      background: linear-gradient(135deg, #ff3399 0%, #ff0066 100%);
      color: #fff;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 14px;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 15px rgba(255, 0, 102, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 20px rgba(255, 0, 102, 0.45);
    }

    .btn-sm {
      padding: 0.4rem 0.8rem;
      font-size: 0.75rem;
      border-radius: 8px;
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--barbie-dark-pink);
      border: 1.5px solid rgba(255, 20, 147, 0.3);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .btn-secondary:hover {
      background: var(--barbie-soft-pink);
      border-color: var(--barbie-pink);
      box-shadow: 0 4px 12px rgba(255, 20, 147, 0.15);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ff4d4d, #d90429);
      box-shadow: 0 4px 15px rgba(217, 4, 41, 0.3);
      color: #fff;
    }

    /* Controls Panel */
    .controls-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
      box-shadow: 0 8px 25px rgba(230, 0, 115, 0.05);
    }

    .filter-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    /* Energy Chips */
    .energy-chips {
      display: flex;
      gap: 0.6rem;
    }

    .chip {
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border: 1.5px solid transparent;
      opacity: 0.6;
      background: #ffffff;
    }

    .chip.active {
      opacity: 1;
      transform: scale(1.05);
    }

    .chip-low {
      border-color: var(--energy-low-border);
      color: var(--energy-low-text);
    }

    .chip-low.active {
      background: var(--energy-low-bg);
      box-shadow: 0 0 10px rgba(130, 201, 30, 0.3);
    }

    .chip-med {
      border-color: var(--energy-med-border);
      color: var(--energy-med-text);
    }

    .chip-med.active {
      background: var(--energy-med-bg);
      box-shadow: 0 0 10px rgba(252, 196, 25, 0.3);
    }

    .chip-high {
      border-color: var(--energy-high-border);
      color: var(--energy-high-text);
    }

    .chip-high.active {
      background: var(--energy-high-bg);
      box-shadow: 0 0 10px rgba(204, 93, 232, 0.3);
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .select-styled {
      background: #ffffff;
      color: var(--text-dark);
      border: 1.5px solid var(--panel-border);
      padding: 0.6rem 1rem;
      border-radius: 12px;
      font-weight: 700;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    /* Grid & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 182, 193, 0.6);
      border-radius: 20px;
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
      box-shadow: 0 4px 15px rgba(230, 0, 115, 0.05);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #ff66b2, var(--barbie-pink), #ff99cc);
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--barbie-pink);
      box-shadow: 0 12px 25px rgba(255, 20, 147, 0.15);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .card-emoji {
      font-size: 2.2rem;
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      line-height: 1.2;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    .tag {
      padding: 0.25rem 0.65rem;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--barbie-soft-pink);
      border: 1px solid rgba(255, 105, 180, 0.3);
      color: var(--barbie-dark-pink);
    }

    .tag-low { background: var(--energy-low-bg); border-color: var(--energy-low-border); color: var(--energy-low-text); }
    .tag-med { background: var(--energy-med-bg); border-color: var(--energy-med-border); color: var(--energy-med-text); }
    .tag-high { background: var(--energy-high-bg); border-color: var(--energy-high-border); color: var(--energy-high-text); }

    .card-footer {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      background: var(--panel-bg);
      border-radius: 20px;
      border: 2px dashed var(--panel-border);
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Modals & Overlays */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(80, 10, 45, 0.4);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #ffffff;
      border: 2px solid var(--barbie-pink);
      box-shadow: 0 15px 40px rgba(255, 20, 147, 0.2);
      border-radius: 24px;
      width: 100%;
      max-width: min(580px, calc(100vw - 3rem));
      max-height: 90vh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 2rem;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--barbie-soft-pink);
      padding-bottom: 1rem;
    }

    .modal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text-dark);
      overflow-wrap: anywhere;
    }

    .close-btn {
      background: var(--barbie-soft-pink);
      border: none;
      color: var(--barbie-dark-pink);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .close-btn:hover {
      background: var(--barbie-pink);
      color: #fff;
    }

    /* Form & Inline Controls */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      color: var(--barbie-dark-pink);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      background: #fff8fa;
      border: 1.5px solid rgba(255, 105, 180, 0.4);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: var(--text-dark);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--barbie-pink);
      box-shadow: 0 0 0 3px rgba(255, 20, 147, 0.15);
      background: #ffffff;
    }

    /* Emoji glyphs render from the emoji font and ignore text color, so a
       placeholder and a typed value of the same emoji look identical.
       Dim the whole field while empty so the swap is visible regardless. */
    #inputEmoji {
      opacity: 1;
      transition: opacity 0.15s ease;
    }

    #inputEmoji:placeholder-shown {
      opacity: 0.4;
    }

    .inline-date-input {
      background: #fff8fa;
      border: 1.5px solid rgba(255, 105, 180, 0.4);
      border-radius: 8px;
      padding: 0.25rem 0.5rem;
      color: var(--text-dark);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      outline: none;
    }

    .save-indicator {
      font-size: 0.75rem;
      color: var(--barbie-dark-pink);
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.3s ease;
      margin-left: 0.5rem;
    }

    .save-indicator.show {
      opacity: 1;
    }

    /* Stash Lists */
    .stash-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .stash-box {
      background: #fff8fa;
      border: 1.5px solid rgba(255, 182, 193, 0.5);
      border-radius: 16px;
      padding: 1rem;
    }

    .stash-title {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--barbie-dark-pink);
      margin-bottom: 0.75rem;
    }

    .stash-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      max-height: 180px;
      overflow-y: auto;
    }

    .stash-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      background: #ffffff;
      border: 1px solid rgba(255, 182, 193, 0.4);
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-dark);
      min-width: 0;
    }

    .stash-item span {
      overflow-wrap: anywhere;
      min-width: 0;
    }

    .stash-input-group {
      display: flex;
      gap: 0.4rem;
    }

    .add-hobby-mobile-slot:not(:empty) {
      margin-bottom: 2rem;
    }

    .btn-full-row {
      width: 100%;
      justify-content: center;
    }

    @media (max-width: 640px) {
      .stash-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Hobby Shuffle</h1>
      <div id="authContainer" class="auth-box">
        <!-- Auth state injected via JS -->
      </div>
    </header>

    <div id="addHobbyMobileSlot" class="add-hobby-mobile-slot"></div>

    <div class="controls-panel">
      <div class="filter-section">
        <span class="filter-label">Energy Level:</span>
        <div class="energy-chips">
          <div class="chip chip-low" onclick="toggleChip(this, 1)">Low Energy</div>
          <div class="chip chip-med" onclick="toggleChip(this, 2)">Medium Energy</div>
          <div class="chip chip-high" onclick="toggleChip(this, 3)">High Energy</div>
        </div>
      </div>

      <div class="action-group">
        <select id="sortBy" class="select-styled" onchange="renderGrid()">
          <option value="recent-desc">Most Recent First</option>
          <option value="recent-asc">Oldest / Resting First</option>
          <option value="energy-asc">Energy: Low to High</option>
          <option value="energy-desc">Energy: High to Low</option>
        </select>
        
        <button class="btn btn-secondary" onclick="triggerRandomizer()">Randomizer</button>
        <button id="addHobbyBtn" class="btn" style="display:none;" onclick="openAddModal()">+ Add Hobby</button>
      </div>
    </div>

    <div id="hobbyGrid" class="grid">
      <!-- Cards injected dynamically -->
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModalOverlay" class="modal-overlay" onclick="handleBackdropClick(event, 'detailModalOverlay')">
    <div class="modal">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:0.75rem;">
          <span id="detailEmoji" style="font-size: 2.2rem;"></span>
          <div>
            <h2 id="detailTitle" class="modal-title">Hobby Detail</h2>
            <div id="detailMeta" style="font-size:0.8rem; color:var(--text-muted); font-weight:700;"></div>
          </div>
        </div>
        <button class="close-btn" onclick="closeModal('detailModalOverlay')">✕</button>
      </div>

      <!-- Quick Edit: Last Active Date -->
      <div class="form-group" style="display:flex; align-items:center; gap:0.75rem; background:var(--barbie-soft-pink); padding:0.6rem 1rem; border-radius:12px;">
        <label class="form-label" style="margin-bottom:0;">Last Active:</label>
        <input type="date" id="detailInlineDate" class="inline-date-input" onchange="saveInlineField('lastDone', this.value)">
        <span id="inlineDateSaveMsg" class="save-indicator">Saved!</span>
      </div>

      <!-- Quick Edit: Current Focus -->
      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label class="form-label">Current Focus / Project</label>
          <span id="inlineFocusSaveMsg" class="save-indicator">Saved!</span>
        </div>
        <textarea id="detailInlineFocus" class="form-textarea" rows="2" placeholder="What are you working on right now?" onblur="saveInlineField('focus', this.value)"></textarea>
      </div>

      <!-- Quick Edit: Resources & Notes -->
      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label class="form-label">Resources & Notes</label>
          <span id="inlineResourcesSaveMsg" class="save-indicator">Saved!</span>
        </div>
        <textarea id="detailInlineResources" class="form-textarea" rows="2" placeholder="Links, guides, ideas..." onblur="saveInlineField('resources', this.value)"></textarea>
      </div>

      <div class="stash-grid">
        <div class="stash-box">
          <div class="stash-title">Owned Supplies</div>
          <ul id="detailOwnedList" class="stash-list"></ul>
          <div class="stash-input-group">
            <input type="text" id="newOwnedInput" class="form-input" style="padding:0.4rem;" placeholder="Add supply...">
            <button class="btn btn-sm" onclick="addStashItem('owned')">+</button>
          </div>
        </div>

        <div class="stash-box">
          <div class="stash-title">Wishlist / Wanted</div>
          <ul id="detailWantedList" class="stash-list"></ul>
          <div class="stash-input-group">
            <input type="text" id="newWantedInput" class="form-input" style="padding:0.4rem;" placeholder="Add to wishlist...">
            <button class="btn btn-sm" onclick="addStashItem('wanted')">+</button>
          </div>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--barbie-soft-pink);">
        <button class="btn btn-secondary" onclick="editCurrentHobby()">Full Edit</button>
        <button class="btn" onclick="closeModal('detailModalOverlay')">Done</button>
      </div>
    </div>
  </div>

  <!-- Form Modal (Add / Full Edit) -->
  <div id="formModalOverlay" class="modal-overlay" onclick="handleBackdropClick(event, 'formModalOverlay')">
    <div class="modal">
      <div class="modal-header">
        <h2 id="formModalTitle" class="modal-title">Add Hobby</h2>
        <button class="close-btn" onclick="closeModal('formModalOverlay')">✕</button>
      </div>

      <form id="hobbyForm" onsubmit="saveHobby(event)">
        <input type="hidden" id="hobbyId">

        <div style="display:grid; grid-template-columns:80px 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label">Emoji</label>
            <input 
              type="text" 
              id="inputEmoji" 
              class="form-input" 
              style="text-align:center; font-size:1.2rem; cursor:pointer;" 
              placeholder="🎨" 
              maxlength="8"
              onfocus="handleEmojiFocus(this)"
              onclick="handleEmojiFocus(this)"
              oninput="handleEmojiInput(this)"
            >
          </div>

          <div class="form-group">
            <label class="form-label">Hobby Title</label>
            <input type="text" id="inputTitle" class="form-input" required placeholder="e.g. Jewelry Making">
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label">Energy Level</label>
            <select id="inputEnergy" class="form-select">
              <option value="1">Low Energy</option>
              <option value="2">Medium Energy</option>
              <option value="3">High Energy</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Last Active Date</label>
            <input type="date" id="inputLastDone" class="form-input" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Location / Spot</label>
          <input type="text" id="inputLocation" class="form-input" placeholder="e.g. Desk, Studio, Balcony">
        </div>

        <div class="form-group">
          <label class="form-label">Current Focus</label>
          <textarea id="inputFocus" class="form-textarea" rows="2" placeholder="What are you currently working on?"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Resources & Notes</label>
          <textarea id="inputResources" class="form-textarea" rows="2" placeholder="Links, guides, inspiration..."></textarea>
        </div>

        <div style="display:flex; justify-content:space-between; gap:1rem; margin-top:1.5rem;">
          <button type="button" id="deleteBtn" class="btn btn-danger" onclick="deleteHobby()" style="display:none;">Delete</button>
          <div style="display:flex; gap:0.5rem; margin-left:auto;">
            <button type="button" class="btn btn-secondary" onclick="closeModal('formModalOverlay')">Cancel</button>
            <button type="submit" class="btn">Save Hobby</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Auth & DB Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getDatabase, ref, onValue, set, push, remove } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDqPjoCg0gYKmxBkF3-7eqYilmLdJqvGU8",
      authDomain: "house-motives.firebaseapp.com",
      databaseURL: "https://house-motives-default-rtdb.firebaseio.com",
      projectId: "house-motives",
      storageBucket: "house-motives.firebasestorage.app",
      messagingSenderId: "338470965043",
      appId: "1:338470965043:web:6285a617886f5b87ce3846"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    window.currentUser = null;
    window.hobbies = [];
    window.activeHobbyId = null;
    window.selectedEnergies = [];

    const hobbiesRef = ref(db, 'hobbies');
    let unsubscribeListener = null;

    onAuthStateChanged(auth, (user) => {
      window.currentUser = user;
      const authContainer = document.getElementById('authContainer');
      const addHobbyBtn = document.getElementById('addHobbyBtn');

      if (user) {
        authContainer.innerHTML = `
          <img class="user-avatar" src="${user.photoURL}" alt="${user.displayName}">
          <span class="user-name">${user.displayName}</span>
          <button class="btn btn-sm btn-secondary" onclick="logout()">Sign Out</button>
        `;
        addHobbyBtn.style.display = 'inline-flex';

        if (unsubscribeListener) unsubscribeListener();
        unsubscribeListener = onValue(hobbiesRef, (snapshot) => {
          const data = snapshot.val();
          window.hobbies = [];
          if (data) {
            Object.keys(data).forEach(key => {
              window.hobbies.push({ id: key, ...data[key] });
            });
          }
          window.renderGrid();
          if (window.activeHobbyId) {
            window.updateDetailViewIfOpen();
          }
        }, (error) => {
          console.error("Firebase read error:", error);
          alert("Permission or Database Error: " + error.message);
        });

      } else {
        authContainer.innerHTML = `<button class="btn" onclick="login()">Sign in with Google</button>`;
        addHobbyBtn.style.display = 'none';
        window.hobbies = [];
        window.renderGrid();
      }
    });

    window.login = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth);

    // Auto-select text & pop native emoji picker on supported browsers
    window.handleEmojiFocus = function(input) {
      input.select();
      if ('showPicker' in HTMLInputElement.prototype) {
        try {
          input.showPicker();
        } catch (e) {
          // Fallback if browser security context blocks showPicker
        }
      }
    };

    // Matches emoji sequences (base + variation selector + ZWJ chains) and flag pairs
    const EMOJI_MATCH_RE = /(?:\p{Extended_Pictographic}(?:\uFE0F|\uFE0E)?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|\uFE0E)?)*)|(?:[\u{1F1E6}-\u{1F1FF}]{2})/gu;

    // Strips anything typed/pasted that isn't a valid emoji, so the field only ever holds emoji
    window.handleEmojiInput = function(input) {
      const cleaned = (input.value.match(EMOJI_MATCH_RE) || []).join('');
      if (input.value !== cleaned) {
        const cursorWasAtEnd = input.selectionStart === input.value.length;
        input.value = cleaned;
        if (cursorWasAtEnd) {
          input.setSelectionRange(cleaned.length, cleaned.length);
        }
      }
    };

    function getAgingBadge(dateString) {
      if (!dateString) return 'Date unknown';
      const last = new Date(dateString);
      const now = new Date();
      const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));
      
      if (isNaN(diffDays)) return 'Date unknown';
      if (diffDays === 0) return 'Done today';
      if (diffDays === 1) return 'Done yesterday';
      if (diffDays < 7) return `Active ${diffDays}d ago`;
      if (diffDays < 14) return 'Resting 1 week';
      if (diffDays < 30) return `Resting ${Math.floor(diffDays / 7)} weeks`;
      if (diffDays < 365) return `Resting ${Math.floor(diffDays / 30)} months`;
      return 'Resting 1+ year';
    }

    function energyLabel(level) {
      if (level == 1) return 'Low Energy';
      if (level == 2) return 'Med Energy';
      if (level == 3) return 'High Energy';
      return '';
    }

    function energyTagClass(level) {
      if (level == 1) return 'tag-low';
      if (level == 2) return 'tag-med';
      if (level == 3) return 'tag-high';
      return '';
    }

    window.toggleChip = function(el, level) {
      el.classList.toggle('active');
      if (window.selectedEnergies.includes(level)) {
        window.selectedEnergies = window.selectedEnergies.filter(l => l !== level);
      } else {
        window.selectedEnergies.push(level);
      }
      window.renderGrid();
    };

    window.renderGrid = function() {
      const grid = document.getElementById('hobbyGrid');
      
      if (!window.currentUser) {
        grid.innerHTML = `<div class="empty-state">Please sign in to view your hobbies.</div>`;
        return;
      }

      const sortBy = document.getElementById('sortBy').value;

      let filtered = window.hobbies.filter(h => {
        if (window.selectedEnergies.length === 0) return true;
        return window.selectedEnergies.includes(parseInt(h.energy));
      });

      filtered.sort((a, b) => {
        if (sortBy === 'recent-desc') return new Date(b.lastDone) - new Date(a.lastDone);
        if (sortBy === 'recent-asc') return new Date(a.lastDone) - new Date(b.lastDone);
        if (sortBy === 'energy-asc') return a.energy - b.energy;
        if (sortBy === 'energy-desc') return b.energy - a.energy;
        return 0;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No hobbies match your filter.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(h => `
        <div class="card" onclick="openDetailModal('${h.id}')">
          <div class="card-top">
            <span class="card-emoji">${h.emoji || '🎨'}</span>
            <span class="tag ${energyTagClass(h.energy)}">${energyLabel(h.energy)}</span>
          </div>
          <div>
            <div class="card-title">${h.title}</div>
            <div class="card-tags">
              ${h.location ? `<span class="tag">${h.location}</span>` : ''}
            </div>
          </div>
          <div class="card-footer">
            ${getAgingBadge(h.lastDone)}
          </div>
        </div>
      `).join('');
    };

    window.openDetailModal = function(id) {
      window.activeHobbyId = id;
      window.updateDetailViewIfOpen();
      document.getElementById('detailModalOverlay').classList.add('active');
    };

    window.updateDetailViewIfOpen = function() {
      if (!window.activeHobbyId) return;
      const h = window.hobbies.find(item => item.id === window.activeHobbyId);
      if (!h) return;

      document.getElementById('detailEmoji').innerText = h.emoji || '🎨';
      document.getElementById('detailTitle').innerText = h.title;
      document.getElementById('detailMeta').innerText = `${getAgingBadge(h.lastDone)} • ${energyLabel(h.energy)} ${h.location ? '• ' + h.location : ''}`;
      
      const inlineDate = document.getElementById('detailInlineDate');
      const inlineFocus = document.getElementById('detailInlineFocus');
      const inlineResources = document.getElementById('detailInlineResources');

      if (document.activeElement !== inlineDate) inlineDate.value = h.lastDone || '';
      if (document.activeElement !== inlineFocus) inlineFocus.value = h.focus || '';
      if (document.activeElement !== inlineResources) inlineResources.value = h.resources || '';

      renderStashLists(h);
    };

    window.saveInlineField = function(field, val) {
      if (!window.currentUser || !window.activeHobbyId) return;
      const hobby = window.hobbies.find(h => h.id === window.activeHobbyId);
      if (!hobby) return;

      if (hobby[field] === val) return;

      set(ref(db, `hobbies/${hobby.id}/${field}`), val)
        .then(() => {
          let msgId = '';
          if (field === 'lastDone') msgId = 'inlineDateSaveMsg';
          if (field === 'focus') msgId = 'inlineFocusSaveMsg';
          if (field === 'resources') msgId = 'inlineResourcesSaveMsg';

          if (msgId) {
            const el = document.getElementById(msgId);
            if (el) {
              el.classList.add('show');
              setTimeout(() => el.classList.remove('show'), 2000);
            }
          }
        })
        .catch(err => console.error("Inline save error:", err));
    };

    function renderStashLists(hobby) {
      const ownedUl = document.getElementById('detailOwnedList');
      const wantedUl = document.getElementById('detailWantedList');

      ownedUl.innerHTML = (hobby.owned || []).map((item, idx) => `
        <li class="stash-item">
          <span>${item}</span>
          <button class="btn btn-sm btn-secondary" onclick="removeStashItem('owned', ${idx})">✕</button>
        </li>
      `).join('') || '<li style="font-size:0.8rem; color:var(--text-muted);">No owned supplies listed.</li>';

      wantedUl.innerHTML = (hobby.wanted || []).map((item, idx) => `
        <li class="stash-item">
          <span>${item}</span>
          <div style="display:flex; gap:4px;">
            <button class="btn btn-sm" title="Move to Owned" onclick="moveWantedToOwned(${idx})">→ Owned</button>
            <button class="btn btn-sm btn-secondary" onclick="removeStashItem('wanted', ${idx})">✕</button>
          </div>
        </li>
      `).join('') || '<li style="font-size:0.8rem; color:var(--text-muted);">No wishlist items.</li>';
    }

    window.addStashItem = function(type) {
      if (!window.currentUser) return;
      const hobby = window.hobbies.find(h => h.id === window.activeHobbyId);
      if (!hobby) return;

      const inputId = type === 'owned' ? 'newOwnedInput' : 'newWantedInput';
      const input = document.getElementById(inputId);
      const val = input.value.trim();

      if (val) {
        let owned = hobby.owned ? [...hobby.owned] : [];
        let wanted = hobby.wanted ? [...hobby.wanted] : [];
        
        if (type === 'owned') owned.push(val);
        if (type === 'wanted') wanted.push(val);

        input.value = '';
        set(ref(db, `hobbies/${hobby.id}/owned`), owned);
        set(ref(db, `hobbies/${hobby.id}/wanted`), wanted);
      }
    };

    window.moveWantedToOwned = function(index) {
      if (!window.currentUser) return;
      const hobby = window.hobbies.find(h => h.id === window.activeHobbyId);
      if (!hobby) return;

      let owned = hobby.owned ? [...hobby.owned] : [];
      let wanted = hobby.wanted ? [...hobby.wanted] : [];

      const itemToMove = wanted.splice(index, 1)[0];
      if (itemToMove) {
        owned.push(itemToMove);
        set(ref(db, `hobbies/${hobby.id}/owned`), owned);
        set(ref(db, `hobbies/${hobby.id}/wanted`), wanted);
      }
    };

    window.removeStashItem = function(type, index) {
      if (!window.currentUser) return;
      const hobby = window.hobbies.find(h => h.id === window.activeHobbyId);
      if (!hobby) return;

      let owned = hobby.owned ? [...hobby.owned] : [];
      let wanted = hobby.wanted ? [...hobby.wanted] : [];

      if (type === 'owned') owned.splice(index, 1);
      if (type === 'wanted') wanted.splice(index, 1);

      set(ref(db, `hobbies/${hobby.id}/owned`), owned);
      set(ref(db, `hobbies/${hobby.id}/wanted`), wanted);
    };

    window.openAddModal = function() {
      document.getElementById('formModalTitle').innerText = 'Add Hobby';
      document.getElementById('hobbyId').value = '';
      document.getElementById('hobbyForm').reset();
      document.getElementById('inputEmoji').value = '';
      document.getElementById('inputLastDone').valueAsDate = new Date();
      document.getElementById('deleteBtn').style.display = 'none';

      document.getElementById('formModalOverlay').classList.add('active');
    };

    window.editCurrentHobby = function() {
      closeModal('detailModalOverlay');
      const h = window.hobbies.find(item => item.id === window.activeHobbyId);
      if (!h) return;

      document.getElementById('formModalTitle').innerText = 'Edit Hobby';
      document.getElementById('hobbyId').value = h.id;
      document.getElementById('inputEmoji').value = h.emoji || '🎨';
      document.getElementById('inputTitle').value = h.title;
      document.getElementById('inputEnergy').value = h.energy;
      document.getElementById('inputLastDone').value = h.lastDone;
      document.getElementById('inputLocation').value = h.location || '';
      document.getElementById('inputFocus').value = h.focus || '';
      document.getElementById('inputResources').value = h.resources || '';
      document.getElementById('deleteBtn').style.display = 'block';

      document.getElementById('formModalOverlay').classList.add('active');
    };

    window.saveHobby = function(e) {
      e.preventDefault();
      if (!window.currentUser) return alert("Please sign in first!");

      const id = document.getElementById('hobbyId').value;
      const emoji = document.getElementById('inputEmoji').value.trim() || '🎨';
      const title = document.getElementById('inputTitle').value.trim();
      const energy = parseInt(document.getElementById('inputEnergy').value);
      const lastDone = document.getElementById('inputLastDone').value;
      const location = document.getElementById('inputLocation').value.trim();
      const focus = document.getElementById('inputFocus').value.trim();
      const resources = document.getElementById('inputResources').value.trim();

      const existing = window.hobbies.find(h => h.id === id);

      const hobbyData = {
        emoji,
        title,
        energy,
        lastDone,
        location,
        focus,
        resources,
        owned: existing ? (existing.owned || []) : [],
        wanted: existing ? (existing.wanted || []) : []
      };

      if (id) {
        set(ref(db, `hobbies/${id}`), hobbyData)
          .catch(err => alert("Save Error: " + err.message));
      } else {
        const newRef = push(hobbiesRef);
        set(newRef, hobbyData)
          .catch(err => alert("Save Error: " + err.message));
      }

      closeModal('formModalOverlay');
    };

    window.deleteHobby = function() {
      if (!window.currentUser) return;
      const id = document.getElementById('hobbyId').value;
      if (confirm('Are you sure you want to delete this hobby?')) {
        remove(ref(db, `hobbies/${id}`))
          .catch(err => alert("Delete Error: " + err.message));
        closeModal('formModalOverlay');
      }
    };

    window.triggerRandomizer = function() {
      if (window.hobbies.length === 0) return;
      const randomHobby = window.hobbies[Math.floor(Math.random() * window.hobbies.length)];
      openDetailModal(randomHobby.id);
    };

    window.closeModal = function(id) {
      document.getElementById(id).classList.remove('active');
    };

    window.handleBackdropClick = function(event, modalId) {
      if (event.target.id === modalId) {
        closeModal(modalId);
      }
    };

    function relocateAddHobbyBtn() {
      const btn = document.getElementById('addHobbyBtn');
      const mobileSlot = document.getElementById('addHobbyMobileSlot');
      const desktopSlot = document.querySelector('.action-group');
      if (!btn || !mobileSlot || !desktopSlot) return;

      if (window.matchMedia('(max-width: 640px)').matches) {
        if (btn.parentElement !== mobileSlot) mobileSlot.appendChild(btn);
        btn.classList.add('btn-full-row');
      } else {
        if (btn.parentElement !== desktopSlot) desktopSlot.appendChild(btn);
        btn.classList.remove('btn-full-row');
      }
    }

    window.addEventListener('resize', relocateAddHobbyBtn);
    document.addEventListener('DOMContentLoaded', relocateAddHobbyBtn);
    relocateAddHobbyBtn();
  </script>
</body>
</html>
